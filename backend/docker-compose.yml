version: "3.9"

services:
  # ─── PostgreSQL ────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hayat_db
      POSTGRES_USER: hayat_user
      POSTGRES_PASSWORD: hayat_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hayat_user -d hayat_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Redis ─────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── API Server ────────────────────────
  api:
    build: .
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hayat_db
      DB_USER: hayat_user
      DB_PASSWORD: hayat_secret
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: change-me-in-production-access
      JWT_REFRESH_SECRET: change-me-in-production-refresh
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: node --watch src/server.js

volumes:
  postgres_data:
