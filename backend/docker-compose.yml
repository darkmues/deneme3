version: "3.9"

services:
  # ─── PostgreSQL ────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-hayat_db}
      POSTGRES_USER: ${DB_USER:-hayat_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hayat_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hayat_user} -d ${DB_NAME:-hayat_db}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Redis ─────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── API Server ────────────────────────
  api:
    build: .
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: node --watch src/server.js

volumes:
  postgres_data:
